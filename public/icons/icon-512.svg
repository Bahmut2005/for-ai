  <line x1="256" y1="38" x2="256" y2="256" stroke="#05050f" stroke-width="3"/>
  <line x1="410" y1="93" x2="256" y2="256" stroke="#05050f" stroke-width="3"/>
  <line x1="474" y1="256" x2="256" y2="256" stroke="#05050f" stroke-width="3"/>
  <line x1="410" y1="419" x2="256" y2="256" stroke="#05050f" stroke-width="3"/>
  <line x1="256" y1="474" x2="256" y2="256" stroke="#05050f" stroke-width="3"/>
  <line x1="102" y1="419" x2="256" y2="256" stroke="#05050f" stroke-width="3"/>
  <line x1="38" y1="256" x2="256" y2="256" stroke="#05050f" stroke-width="3"/>
  <line x1="102" y1="93" x2="256" y2="256" stroke="#05050f" stroke-width="3"/>
  <!-- Segment shine / inner arc -->
  <circle cx="256" cy="256" r="218" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
