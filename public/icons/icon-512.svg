  <path d="M256 256 L256 474 A218 218 0 0 1 102 419 Z" fill="#22c55e" opacity="0.88"/>
  <path d="M256 256 L102 419 A218 218 0 0 1 38 256 Z" fill="#eab308" opacity="0.88"/>
  <path d="M256 256 L38 256 A218 218 0 0 1 102 93 Z" fill="#ec4899" opacity="0.88"/>
  <path d="M256 256 L102 93 A218 218 0 0 1 256 38 Z" fill="#14b8a6" opacity="0.88"/>
